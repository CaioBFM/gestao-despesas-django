{% extends 'base.html' %}

{% block titulo %}Página Não Encontrada (404){% endblock %}

{% block conteudo %}
<div class="container text-center py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 bg-body-tertiary p-5">
                <div class="card-body">
                    <i class="fa-solid fa-triangle-exclamation text-warning display-1 mb-4"></i>
                    <h1 class="fw-bold text-danger">404</h1>
                    <h3 class="fw-semibold mb-3">Página Não Encontrada</h3>
                    <p class="text-muted mb-4">
                        A página que você está tentando acessar não existe, foi removida ou o endereço foi digitado incorretamente.
                    </p>
                    <a href="/" class="btn btn-primary btn-lg shadow-sm">
                        <i class="fa-solid fa-house me-2"></i> Voltar para o Início
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
