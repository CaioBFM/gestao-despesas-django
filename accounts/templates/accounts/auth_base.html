{% load static %}
<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}SplitExpenses{% endblock %}</title>
    <script>
      try {
        const theme = localStorage.getItem('app-theme');
        if (theme === 'dark') document.documentElement.setAttribute('data-bs-theme', 'dark');
      } catch (_) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/theme.css' %}" rel="stylesheet">
    <link href="{% static 'css/auth.css' %}" rel="stylesheet">
</head>
<body>
  <main class="se-auth-page">
    <button class="se-theme-toggle" id="se-theme-toggle" type="button" aria-label="Alternar entre tema claro e escuro" title="Alternar tema">
      <svg class="se-icon-moon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 15.2A8.5 8.5 0 0 1 8.8 4a8.5 8.5 0 1 0 11.2 11.2Z"/></svg>
      <svg class="se-icon-sun" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <section class="se-auth-card" aria-label="Autenticação SplitExpenses">
      <div class="se-auth-brand">
        <span class="se-brand-arc se-brand-arc-one" aria-hidden="true"></span>
        <span class="se-brand-arc se-brand-arc-two" aria-hidden="true"></span>
        <span class="se-brand-arc se-brand-arc-three" aria-hidden="true"></span>
        <div class="se-brand-lockup">
          <span class="se-brand-symbol" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14.5h27a4 4 0 0 1 4 4V37H9a5 5 0 0 1-5-5V13a5 5 0 0 1 5-5h23v6.5"/><path d="M33 22h11v8H33a4 4 0 1 1 0-8Z"/><circle cx="34" cy="26" r="1.5" fill="#C9A66B" stroke="#C9A66B"/></svg>
          </span>
          <span class="se-brand-name">Split<span>Expenses</span></span>
        </div>
        <p>Despesas compartilhadas, sem complicação.</p>
      </div>
      {% block auth_content %}{% endblock %}
    </section>
  </main>
  <script>
    document.getElementById('se-theme-toggle').addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-bs-theme', next);
      try { localStorage.setItem('app-theme', next); } catch (_) {}
    });
  </script>
</body>
</html>
